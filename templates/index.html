<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSec Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- Markdown parsing library -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <h1>🔒 CyberSec Assistant</h1>
        <div class="chat-box" id="chat-box">
            <div class="message bot-message welcome-message">
                <p>👋 Welcome to CyberSec Assistant! I'm here to help you learn cybersecurity concepts in simple terms. Ask me about topics like phishing, DDoS attacks, SIEM, incident response, and more!</p>
            </div>
        </div>
        <div class="typing-indicator" id="typing-indicator" style="display: none;">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="user-input">
            <input type="text" id="user-message" placeholder="Ask me about cybersecurity topics...">
            <button id="send-button">Send</button>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
